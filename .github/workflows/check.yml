name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24] # engines >=20; 24 is the current CI baseline (F-031)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node scripts/check.mjs
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The full `npm run smoke` matrix stays local: it spawns the `pi` binary and
      # makes real model calls, which GitHub runners do not provision. Run
      # `npm run smoke:full` locally before a release (see
      # docs/findings/2026-08-14-jetbrains-acp-dogfood-findings.md, F-005).
